plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = System.getenv('VERSION_CODE') ?: '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = System.getenv('VERSION_NAME') ?: '1.0.0'
}

// Keystore resolution for Google Play & GitHub Actions CI/CD
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace "com.docubox.app"
    compileSdk = 36
    compileSdkVersion 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            "-Xskip-metadata-version-check"
        ]
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.docubox.app"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    signingConfigs {
        release {
            def keyFileName = System.getenv('DOCUBOX_KEYSTORE_PATH') ?: keystoreProperties['storeFile']
            def storePwd = System.getenv('DOCUBOX_KEYSTORE_PASSWORD') ?: keystoreProperties['storePassword']
            def keyAliasVal = System.getenv('DOCUBOX_KEY_ALIAS') ?: keystoreProperties['keyAlias']
            def keyPwd = System.getenv('DOCUBOX_KEY_PASSWORD') ?: keystoreProperties['keyPassword']

            def resolvedFile = null
            if (keyFileName) {
                if (file(keyFileName).exists()) {
                    resolvedFile = file(keyFileName)
                } else if (rootProject.file(keyFileName).exists()) {
                    resolvedFile = rootProject.file(keyFileName)
                } else if (rootProject.file("app/${keyFileName}").exists()) {
                    resolvedFile = rootProject.file("app/${keyFileName}")
                }
            }

            if (resolvedFile != null && storePwd && keyAliasVal && keyPwd) {
                storeFile resolvedFile
                storePassword storePwd
                keyAlias keyAliasVal
                keyPassword keyPwd
            } else {
                // Safe deterministic fallback for automated builds or local debug signing
                storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0',
                'META-INF/*.kotlin_module'
            ]
        }
    }

    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "androidx.window:window:1.2.0"
    implementation "androidx.window:window-java:1.2.0"
}
